spring.application.name=Coaching-service


spring.datasource.url=jdbc:mysql://localhost:3306/Coaching-service?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=


server.servlet.context-path=/Coaching-service
server.port=5057
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true


# Feign Configuration
feign.client.config.default.connect-timeout=5000
feign.client.config.default.read-timeout=10000
feign.client.config.default.logger-level=basic

feign.client.config.user-management-service.connect-timeout=3000
feign.client.config.user-management-service.read-timeout=5000

# Activer le circuit breaker (fallback) pour Feign
spring.cloud.openfeign.circuitbreaker.enabled=true

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}